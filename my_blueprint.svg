<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 190 330" width="100%" height="100%" style="background-color: #030a16; font-family: monospace;">
    <!-- 1 ACRE LOT BOUNDARY (Cyan) -->
    <rect x="0" y="0" width="150" height="290" fill="none" stroke="#00ffff" stroke-width="2" stroke-dasharray="4,4" />
    <text x="5" y="15" fill="#00ffff" font-size="6">PROPERTY LINE LOT BOUNDARY: 1 ACRE (150' x 290')</text>

    <!-- BACK PATIO DECK (Blue) -->
    <rect x="55" y="105" width="40" height="25" fill="#0a1d37" stroke="#1d4ed8" stroke-width="1.5" />
    <text x="58" y="117" fill="#60a5fa" font-size="5">OUTDOOR CONCRETE PATIO DECK</text>

    <!-- OUTDOOR HOT TUB (Neon Pink) -->
    <rect x="71" y="113" width="8" height="8" fill="#1e1b4b" stroke="#f43f5e" stroke-width="2" />
    <line x1="71" y1="113" x2="79" y2="121" stroke="#f43f5e" stroke-width="0.5" />
    <line x1="79" y1="113" x2="71" y2="121" stroke="#f43f5e" stroke-width="0.5" />
    <text x="69" y="109" fill="#f43f5e" font-size="5" font-weight="bold">OUTDOOR HOT TUB (8'x8')</text>

    <!-- 5 BEDROOM HOUSE PLAN (White) -->
    <rect x="42.5" y="30" width="65" height="75" fill="#061224" stroke="#ffffff" stroke-width="2.5" />
    <text x="46.5" y="42" fill="#ffffff" font-size="6" font-weight="bold">5-BEDROOM ESTATE FOUNDATION</text>

    <!-- ROOMS -->
    <rect x="42.5" y="30" width="22" height="25" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,2" />
    <text x="44.5" y="44" fill="#94a3b8" font-size="4">BR 1 (MASTER)</text>
    <rect x="64.5" y="30" width="20" height="22" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,2" />
    <text x="66.5" y="42" fill="#94a3b8" font-size="4">BR 2</text>
    <rect x="84.5" y="30" width="23" height="22" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,2" />
    <text x="86.5" y="42" fill="#94a3b8" font-size="4">BR 3</text>
    <rect x="42.5" y="75" width="22" height="30" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,2" />
    <text x="44.5" y="90" fill="#94a3b8" font-size="4">BR 4</text>
    <rect x="85.5" y="75" width="22" height="30" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,2" />
    <text x="87.5" y="90" fill="#94a3b8" font-size="4">BR 5</text>
</svg>